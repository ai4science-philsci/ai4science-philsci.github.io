claims:
  all_at_once:
    quotes:
    - exact: The sanctioning of simulations does not cleanly divide into verification and validation.
        In fact, simulation results are sanctioned all at once
      section: 2. Sanctioning Models
      page: 23
  confluence:
    quotes:
    - exact: it is the simultaneous confluence of these efforts, rather than the establishment of each
        one separately, that ultimately gives us confidence in the results
      section: 2. Sanctioning Models
      page: 23
  allen_tuning_flagship:
    quotes:
    - exact: If modelling groups, either consciously or by ‘natural selection,’ are tuning their flagship
        models to fit the same observations, spread of predictions becomes meaningless
      section: ch. 6
      page: 113
