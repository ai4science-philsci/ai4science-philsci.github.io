source:
  citation: sep_measurement
  url: https://plato.stanford.edu/entries/measurement-science/
  local: sources/sep_measurement-science.html
  extract_cmd: textutil -convert txt -stdout {}
claims:
  bridgman:
    quotes:
    - exact: we mean by any concept nothing more than a set of operations; the concept is synonymous with
        the corresponding set of operations.
      section: 4. Operationalism and Conventionalism
  chang:
    quotes:
    - exact: Chang argues that constructing a quantity-concept and standardizing its measurement are co-dependent
        and iterative tasks.
      section: 8.1 Standardization and scientific progress
  borsboom:
    quotes:
    - exact: a test is valid for measuring an attribute if and only if a) the attribute exists, and b)
        variations in the attribute causally produce variations in the outcomes of the measurement procedure
      section: 7.3 Psychometric models and construct validity
  fit_not_validity:
    quotes:
    - exact: A good fit between item responses and a statistical model does not yet determine what the
        questionnaire is measuring.
      section: 7.3 Psychometric models and construct validity
  theory_laden:
    quotes:
    - exact: some level of theory-ladenness is a prerequisite for measurements to have any evidential
        power
      section: 8.2 Theory-ladenness of measurement
  ballung:
    quotes:
    - exact: Such concepts are too multifaceted to be measured on a single metric without loss of meaning
      section: 7.3 Psychometric models and construct validity
  michell:
    quotes:
    - exact: psychometricians have not made serious attempts to test whether the attributes they purport
        to measure have quantitative structure, and instead adopted an overly loose conception of measurement
        that disguises this neglect
      section: 7.3 Psychometric models and construct validity
  irt_reply:
    quotes:
    - exact: Item Response Theory provides probabilistic tests of the quantifiability of attributes
      section: 7.3 Psychometric models and construct validity
  alexandrova:
    quotes:
    - exact: This defeats the purpose of construct validation and turns it into a narrow, technical exercise
      section: 7.3 Psychometric models and construct validity
  construct_validation:
    quotes:
    - exact: One way of validating a psychometric instrument is to test whether different procedures that
        are intended to measure the same latent attribute provide consistent results
      section: 7.3 Psychometric models and construct validity
  psychometric_models:
    quotes:
    - exact: psychometric theory relies predominantly on the development of abstract models that are meant
        to predict subjects’ performance in certain tasks
      section: 7.3 Psychometric models and construct validity
  validation_def:
    quotes:
    - exact: The process of establishing that a procedure measures the intended psychological attribute
        is known as “validation”.
      section: 7.3 Psychometric models and construct validity
  rasch_first_step:
    quotes:
    - exact: The sort of statistical calibration (or “scaling”) provided by Rasch models yields repeatable
        results, but it is often only a first step towards full-fledged psychological measurement.
      section: 7.3 Psychometric models and construct validity
  michell_untested_quantity:
    interpretation:
      says: Joel Michell (2000) argued that psychometricians assume, without testing, that the attributes
        they measure come in quantities.
      whose: ai4science-philsci
    quotes:
    - exact: A more fundamental criticism leveled against psychometrics is that it dogmatically presupposes
        that psychological attributes can be quantified. Michell (2000, 2004b) argues that psychometricians
        have not made serious attempts to test whether the attributes they purport to measure have quantitative
        structure, and instead adopted an overly loose conception of measurement that disguises this neglect.
      section: 7.3 Psychometric models and construct validity
  irt_tests_quantity:
    interpretation:
      says: Denny Borsboom and Gideon Mellenbergh (2004) replied that item response theory supplies such
        tests ([Measurement](/measurement/measurement/)).
      whose: ai4science-philsci
    quotes:
    - exact: In response, Borsboom and Mellenbergh (2004) argue that Item Response Theory provides probabilistic
        tests of the quantifiability of attributes.
      section: 7.3 Psychometric models and construct validity
