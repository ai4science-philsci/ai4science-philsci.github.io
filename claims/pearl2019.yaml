    - exact: I call the levels 1. Association, 2. Intervention, and 3. Counterfactual, to match their
        usage.
      section: The Three-Level Causal Hierarchy
      page: 56
  hierarchy_information:
    interpretation:
      says: Causal questions sit on different rungs of Judea Pearl's hierarchy, association, intervention
        and counterfactual, and each rung needs different assumptions before any calculation begins.
      whose: ai4science-philsci
    quotes:
    - exact: The classification forms a three-level hierarchy in the sense that questions at level i (i
