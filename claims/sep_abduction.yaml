source:
  citation: sep_abduction
  url: https://plato.stanford.edu/entries/abduction/
  local: sources/sep_abduction.html
  extract_cmd: textutil -convert txt -stdout {}
claims:
  ibe_name:
    quotes:
    - exact: In the latter sense, abduction is also often called “Inference to the Best Explanation.”
      section: Introduction
  bad_lot:
    quotes:
    - exact: it must hold that at least typically the absolutely best explanation of the evidence is to
        be found among the candidate explanations we have come up with, for else ABD1 may well lead us
        to believe “the best of a bad lot” (van Fraassen 1989, 143)
      section: 2. Explicating Abduction
  diagnosis:
    quotes:
    - exact: physicians tend to go for the hypothesis that best explains the patient’s symptoms
      section: 1.2 The ubiquity of abduction
  abduction_ibe:
    interpretation:
      says: Philosophers call this abduction, or inference to the best explanation, and physicians use
        it whenever they settle on the diagnosis that best fits the symptoms.
      whose: ai4science-philsci
    quotes:
    - exact: In the latter sense, abduction is also often called “Inference to the Best Explanation.”
      section: Introduction
  medical_diagnosis:
    interpretation:
      says: Philosophers call this abduction, or inference to the best explanation, and physicians use
        it whenever they settle on the diagnosis that best fits the symptoms.
      whose: ai4science-philsci
    quotes:
    - exact: 'Abduction is also said to be the predominant mode of reasoning in medical diagnosis: physicians
        tend to go for the hypothesis that best explains the patient’s symptoms'
      section: 1.2 The ubiquity of abduction
  compares_given_set:
    interpretation:
      says: Van Fraassen objected that the rule compares only the hypotheses someone thought of.
      whose: ai4science-philsci
    quotes:
    - exact: For ABD1 takes as its premise only that some hypothesis is the best explanation of the evidence
        as compared to other hypotheses in a given set.
      section: 2. Explicating Abduction
