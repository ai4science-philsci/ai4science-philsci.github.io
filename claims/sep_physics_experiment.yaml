  regress:
    quotes:
    - exact: What scientists take to be a correct result is one obtained with a good, that is, properly
        functioning, experimental apparatus. But a good experimental apparatus is simply one that gives
        correct results.
      section: 2.2.1 The Experimenters’ Regress
