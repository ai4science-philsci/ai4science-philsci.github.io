claims:
  crime_rates_corruptible:
    interpretation:
      says: The social scientist Donald Campbell had made a parallel point about indicators used to run
        institutions, such as test scores and crime statistics.
      whose: ai4science-philsci
    quotes:
    - exact: Crime rates are in general very corruptible indicators.
      page: 35
  test_scores_lose_value:
    interpretation:
      says: The social scientist Donald Campbell had made a parallel point about indicators used to run
        institutions, such as test scores and crime statistics.
      whose: ai4science-philsci
    quotes:
    - exact: But when test scores become the goal of the teaching process, they both lose their value
        as indicators of educational status and distort the educational process in undesirable ways.
      page: 35
  indicators_used_corrupted:
    interpretation:
      says: Goodhart and Campbell wrote about economic and social indicators in institutions, where the
        people measured respond to the measurement.
      whose: ai4science-philsci
    quotes:
    - exact: The more any quantitative social indicator is used for social decision-making, the more subject
        it will be to corruption pressures and the more apt it will be to distort and corrupt the social
        processes it is intended to monitor.
      page: 34
