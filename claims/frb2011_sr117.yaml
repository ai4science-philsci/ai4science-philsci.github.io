claims:
  sound_but_misapplied:
    quotes:
    - exact: Even a fundamentally sound model producing accurate outputs consistent with the design objective
        of the model may exhibit high model risk if it is misapplied or misused.
  outside_environment:
    quotes:
    - exact: This is even more of a concern if a model is used outside the environment for which it was
        designed.
